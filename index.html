    <h1 class="title">Verifiability Is How AI Safety Spending Scales</h1>
    <p class="byline">Will Cuozzo &nbsp;·&nbsp; June 2026</p>

  <script type="text/markdown" id="source">
Verification is the key for translating money into AI safety impact at scale because it allows capital to buy labor without running into bottlenecks. Directing large amounts of dollars at easy-to-verify problems could have a high impact on safety right now, and work to expand the number of problems that are easy-to-verify is very high leverage.

To see why this matters, it's worth looking at how people try to turn dollars into impact today and where that process hits ceilings. Current grantmaking relies on [weeks to months](https://coefficientgiving.org/our-approach/grantmaking-process/) of investigation and dozens of hours of grantmaker labor. This is genuinely valuable, and it's worth trying to [scale](https://www.lesswrong.com/posts/qdhyrN4uKwBAftmQx/there-should-be-usd100m-grants-to-automate-ai-safety). But it runs into problems with adverse selection, optics, onboarding, and serial time. Lowering the bar to approve $100M grants invites adverse selection and lowers the signal to noise of applications. Fraudulent actors at that scale are a major reputational hit. The returns to capital are real but diminish well below the hundreds of billions plausibly needed, as evidenced by a grantmaker at Coefficient Giving already reporting they are "[bottlenecked \[on\] grantmaker bandwidth.](https://www.lesswrong.com/posts/gLt7KJkhiEDwoPkae/three-positive-updates-i-made-about-technical-grantmaking-at)"

The key is verifiability, or knowing what success looks like, which then opens up a variety of scalable approaches. You can have open bounties, structured competitions, or tiered grants based on intermediate successes. You can more confidently throw semi-trusted AI labor at problems. As a bonus, you have better optics because payouts only happen after results.

Importantly, the unlock is verifiability as opposed to the bounties themselves. For hard-to-verify problems, experienced researcher time spent evaluating bounty submissions could be [less valuable](https://www.lesswrong.com/posts/aEiZfHAXeKXF5PJgH/ai-safety-has-a-scaling-problem?commentId=bXZxh7yG6usxM8TFP) than time spent on research or mentorship. This lens suggests two kinds of valuable projects: easy-to-verify problems, and projects that make more problems easy-to-verify.

For the first direction, the worry is that easy-to-verify problems relevant to AI safety are scarce. This concern is real, but a few directions look promising.

1. **Trojan detection and other tractable [interpretability benchmarks](https://arxiv.org/abs/2302.10894).** It is easy to verify if you've found a trojan, but the problem of finding them in neural nets is largely unsolved. Many [competitions](https://trojandetection.ai/) for trojan detection have already been hosted, and scaling up prize money and breadth is feasible. Also, the setup is similar to other kinds of safety-relevant conditional behavioral changes such as jailbreaks, [alignment faking](https://arxiv.org/abs/2412.14093) (conditioning on training vs deployment), and [conditional emergent misalignment](https://arxiv.org/abs/2604.25891). As Yudkowsky [noted](https://www.dwarkesh.com/p/eliezer-yudkowsky), "Interpretability is a kind of work where you can actually see the results and verify that they're good results," so "Let's offer $100 billion in prizes for interpretability".

2. **Red-team vs blue-team competitions,** where each team acts as the verifier for the other. The control agenda championed by Redwood Research fits nicely here. The [paper](https://arxiv.org/abs/2312.06942) is already set up as a red-team trying to sneak code vulnerabilities past the blue-team trying to catch them. You can vary the setup, have AIs play these games, and train AIs to be particularly good at these games in a GAN-like fashion. The red-team models in these setups need to be handled with appropriate security, since we're eliciting misalignment.

3. **Self-contained mathematical problems,** like ARC's 2023 [matrix-completion bounties](https://www.alignment.org/blog/prize-for-matrix-completion-problems/). I could see similar self-contained problems pop up in work on [superposition](https://transformer-circuits.pub/2022/toy_model/index.html) or [learning](https://arxiv.org/abs/2010.11560) [theory](https://arxiv.org/abs/1804.06561).

The second direction of valuable work is improving verifiability infrastructure. Taking interpretability as an example, this is work that improves techniques like [causal scrubbing](https://www.alignmentforum.org/posts/JvZhhzycHu2Yd57RN/causal-scrubbing-a-method-for-rigorously-testing) or [compact proofs](https://arxiv.org/abs/2406.11779). Progress can also look like improving evaluations of interpretability methods on [downstream tasks](https://www.lesswrong.com/posts/StENzDcD3kpfGJssR/a-pragmatic-vision-for-interpretability) such as language model [auditing](https://arxiv.org/abs/2503.10965), [eval-awareness steering](https://arxiv.org/abs/2510.20487), or the aforementioned trojan detection.

I also expect verification to matter for AI safety broadly. If we deeply trusted safety evals, a regulatory scheme would naturally incentivize labs to be safer. In their current state, my guess is any verifier would be Goodharted and likely backfire (e.g. training the CoT to look good makes [real deception harder to find](https://www.lesswrong.com/posts/mpmsK8KKysgSKDm2T/the-most-forbidden-technique)), but that does not have to be true for good enough verifiers used by external auditors. For international coordination, good verifiers (chip tracking, energy use tracking) could play the role that [satellite imagery and seismic monitoring](https://www.darpa.mil/about/innovation-timeline/vela-nuclear-explosion-detection) did to track nuclear tests.

It is important that the verifiers are good. Some properties for a good verifier I have in mind:

1. **Relevant:** When it passes, even without accounting for Goodharting, is it what you care about?
2. **Goodhart resistant:** How many bits of optimization pressure can you apply before you expect it to break?
3. **Cheap.** Expensive verifiers won't scale, but you can cascade increasingly expensive checks to mitigate this.
4. **Informative.** If your interpretability tool could not only tell you that your explanation failed, but also why, it could be a useful [debugger](https://www.neelsomaniblog.com/p/the-endgame-for-mechanistic-interpretability).

COVID-era responses are a [known reference class](https://www.lesswrong.com/posts/wTKjRFeSjKLDSWyww/possible-takeaways-from-the-coronavirus-pandemic-for-slow-ai) for recent attempts at deploying large amounts of capital quickly to solve a humanitarian crisis. Operation Warp Speed in particular offers a useful data point for mixing scaled grantmaking with verifier-based incentives. Advance Purchase Agreements guaranteed high payouts for pharmaceutical companies that could produce a vaccine that passed FDA approval within certain time periods. At the same time, companies could enter contracts that required sending various reports and intermediate results to BARDA who would decide whether to keep reimbursing expenditures. Pfizer was incentivized by the former and could front more of the cost to avoid dealing with the bureaucracy of the latter. As a smaller company, Moderna relied on more of the latter for funding. While overall reaction to the pandemic was too slow, once enacted, [both](https://www.politifact.com/article/2020/nov/19/pfizer-moderna-covid-19-vaccines-and-operation-war/) strategies seemed additive.

A focus on verifiability will not obsolete the value of thoughtful grantmaking and intrinsically motivated safety researchers. Furthermore, we should judge projects based on many criteria such as tractability, relevance, and how they fit into a diverse portfolio of strategies. Also, this approach has its own failure modes. For example, someone who would otherwise work on a more relevant hard-to-verify problem could be drawn to a less relevant easy-to-verify problem.

Still, verifiability is what makes dollars convert into labor without immediately running into other bottlenecks, and that's what scales.
